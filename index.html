    ═══════════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#2E7D32" />
    <script>
      // Apply the saved theme before first paint to prevent dark-mode FOUC.
      // Mirrors src/core/theme/ThemeManager.tsx (STORAGE_KEY + legacy key).
      (function () {
        try {
          var t = localStorage.getItem('agri_theme_preference') || localStorage.getItem('bkl_theme_preference');
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) { document.documentElement.classList.add('light'); }
      })();
    </script>
