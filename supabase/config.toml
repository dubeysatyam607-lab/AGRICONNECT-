[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "hello.agriconnect@gmail.com"
pass = "env(EMAIL_PASS)"
admin_email = "hello.agriconnect@gmail.com"
sender_name = "AgriConnect"
